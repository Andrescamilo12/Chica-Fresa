<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Chica Fresa 🍓❤️</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@500;700&family=Lato:wght@300;400&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --rose: #c2185b;
            --gold: #c9a84c;
            --parchment: #f5ead9;
            --parchment2: #ede0c8;
            --ink: #3b2a1a;
            --spine: #8b1a3a;
        }

        body {
            background: radial-gradient(ellipse at top, #1a0a0f 0%, #0d0005 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* ── floating petals ── */
        .petals-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: .65;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ── title bar ── */
        .title-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 14px 20px 10px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(13, 0, 5, .95), transparent);
        }

        .title-bar h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.6rem, 5vw, 2.6rem);
            color: #fff;
            text-shadow: 0 0 30px #c2185b, 0 0 60px #c2185b55;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px #c2185b, 0 0 40px #c2185b55;
            }

            to {
                text-shadow: 0 0 40px #ff4d94, 0 0 80px #ff4d9455;
            }
        }

        .title-bar p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: .85rem;
            color: #f8bbd099;
            margin-top: 4px;
        }

        /* ── book stage ── */
        #stage {
            perspective: 2000px;
            position: relative;
            z-index: 1;
            margin-top: 10px;
        }

        /* ── book shell ── */
        #book {
            width: min(92vw, 680px);
            height: min(72vh, 520px);
            position: relative;
        }

        /* ── each page ── */
        .page {
            position: absolute;
            inset: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform .85s cubic-bezier(.645, .045, .355, 1);
            cursor: pointer;
        }

        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* front / back faces */
        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 4px 12px 12px 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .face.back {
            transform: rotateY(180deg);
            border-radius: 12px 4px 4px 12px;
        }

        /* parchment surface */
        .face {
            background: var(--parchment);
            box-shadow:
                -4px 0 14px rgba(0, 0, 0, .5),
                6px 6px 32px rgba(0, 0, 0, .55),
                inset 8px 0 22px rgba(139, 90, 43, .1);
        }

        .face.back {
            background: var(--parchment2);
            box-shadow:
                4px 0 14px rgba(0, 0, 0, .5),
                -6px 6px 32px rgba(0, 0, 0, .45),
                inset -8px 0 22px rgba(139, 90, 43, .1);
        }

        /* lined paper */
        .face::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(to bottom,
                    transparent 0px, transparent 37px,
                    #d4a57430 37px, #d4a57430 38px);
            pointer-events: none;
        }

        /* spine line */
        .face::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 26px;
            background: linear-gradient(to right, rgba(201, 168, 76, .2), transparent);
            border-right: 2px solid rgba(201, 168, 76, .4);
            z-index: 1;
        }

        .face.back::before {
            left: auto;
            right: 0;
            background: linear-gradient(to left, rgba(201, 168, 76, .2), transparent);
            border-right: none;
            border-left: 2px solid rgba(201, 168, 76, .4);
        }

        /* page content */
        .page-inner {
            flex: 1;
            padding: 36px 42px 30px 54px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .face.back .page-inner {
            padding: 36px 54px 30px 42px;
        }

        .page-num {
            font-family: 'Playfair Display', serif;
            font-size: .72rem;
            color: var(--gold);
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .page-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            color: var(--rose);
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(194, 24, 91, .25);
        }

        .page-text-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(.88rem, 1.8vw, 1rem);
            line-height: 1.85;
            color: var(--ink);
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            /* hide scrollbar visually */
            scrollbar-width: none;
        }

        .page-text::-webkit-scrollbar {
            display: none;
        }

        /* fade at bottom when more text below */
        .page-text-wrap::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: linear-gradient(to bottom, transparent, var(--parchment));
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s;
        }

        .page-text-wrap.has-more::after {
            opacity: 1;
        }

        /* scroll hint arrow */
        .scroll-hint {
            text-align: center;
            font-size: .82rem;
            color: rgba(194, 24, 91, .85);
            letter-spacing: 2px;
            height: 20px;
            opacity: 0;
            transition: opacity .3s;
            flex-shrink: 0;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(194, 24, 91, .4);
        }

        .page-text-wrap.has-more .scroll-hint {
            opacity: 1;
        }

        .page-ornament {
            text-align: center;
            font-size: 1rem;
            color: rgba(194, 24, 91, .5);
            letter-spacing: 6px;
            margin-top: 14px;
        }

        /* ── COVER ── */
        #cover-page {
            position: absolute;
            inset: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform .85s cubic-bezier(.645, .045, .355, 1);
            cursor: pointer;
        }

        #cover-page.flipped {
            transform: rotateY(-180deg);
            pointer-events: none;
        }

        .cover-front {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            background: linear-gradient(160deg, #5a0028 0%, #1e0010 50%, #4a001e 100%);
            border-radius: 4px 14px 14px 4px;
            border: 1px solid rgba(201, 168, 76, .3);
            box-shadow:
                -6px 0 20px rgba(0, 0, 0, .7),
                14px 14px 50px rgba(0, 0, 0, .8),
                inset 0 0 80px rgba(194, 24, 91, .07);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 50px;
            text-align: center;
        }

        .cover-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            background: var(--parchment2);
            border-radius: 14px 4px 4px 14px;
            box-shadow: 4px 0 14px rgba(0, 0, 0, .5);
        }

        .cover-ornament {
            font-size: 2rem;
            color: var(--gold);
            letter-spacing: 10px;
            margin-bottom: 18px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        .cover-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            width: 75%;
            margin: 16px auto;
        }

        .cover-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 6vw, 3.2rem);
            color: #fff;
            text-shadow: 0 0 30px rgba(194, 24, 91, .6);
            line-height: 1.2;
        }

        .cover-sub {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #f8bbd0cc;
            font-size: 1rem;
            margin-top: 10px;
        }

        .cover-hint {
            position: absolute;
            bottom: 20px;
            font-family: 'Lato', sans-serif;
            font-size: .78rem;
            color: rgba(255, 255, 255, .3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cover-heart {
            font-size: 2.2rem;
            margin-top: 20px;
            display: inline-block;
            animation: heartbeat 1.4s ease-in-out infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.18);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.1);
            }
        }

        /* ── navigation arrows ── */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 30;
            background: rgba(194, 24, 91, .18);
            border: 1px solid rgba(194, 24, 91, .4);
            color: #f8bbd0;
            font-size: 1.8rem;
            width: 48px;
            height: 80px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, transform .2s;
            backdrop-filter: blur(4px);
        }

        .nav-btn:hover {
            background: rgba(194, 24, 91, .4);
            transform: translateY(-50%) scale(1.05);
        }

        .nav-btn:disabled {
            opacity: .2;
            cursor: default;
        }

        #btn-prev {
            left: clamp(6px, 2vw, 30px);
        }

        #btn-next {
            right: clamp(6px, 2vw, 30px);
        }

        /* ── page counter ── */
        #page-indicator {
            position: fixed;
            bottom: 28px;
            font-family: 'Playfair Display', serif;
            font-size: .85rem;
            color: #f8bbd077;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* ── footer ── */
        #footer-text {
            position: fixed;
            bottom: 8px;
            font-family: 'Dancing Script', cursive;
            font-size: .95rem;
            color: rgba(248, 187, 208, .4);
            z-index: 10;
        }

        /* ── page-curl shadow hint on right edge ── */
        .page-curl {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, transparent 50%, rgba(0, 0, 0, .12) 50%);
            border-radius: 0 0 12px 0;
            pointer-events: none;
            z-index: 3;
        }

        /* ════════════════════════════════════════════════════
           MOBILE SAFE MODE
           • 100% 2D: evita artefactos GPU/3D en teléfonos
           • Solo la página actual queda visible
           • Sin pseudo-elementos rayados ni backdrop-filter
           ════════════════════════════════════════════════════ */
        @media (max-width: 640px) {

            html {
                width: 100%;
                height: 100%;
                background: #0d0005;
            }

            body {
                width: 100%;
                height: 100%;
                min-height: 100dvh;
                overflow: hidden !important;
                background: #0d0005 !important;
                display: block;
                position: relative;
            }

            /* Desactivar elementos decorativos que pueden forzar composición GPU */
            #petals {
                display: none !important;
            }

            .title-bar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                width: 100%;
                padding: 10px 10px 8px;
                background: #0d0005 !important;
                z-index: 100;
            }

            .title-bar h1 {
                font-size: 1.45rem;
                line-height: 1.2;
                text-shadow: none !important;
                animation: none !important;
            }

            .title-bar p {
                font-size: .72rem;
                line-height: 1.35;
                margin-top: 3px;
            }

            #footer-text {
                font-size: .75rem;
                bottom: 5px;
                max-width: 80vw;
                text-align: center;
                left: 10vw;
                right: 10vw;
            }

            /* Contenedor completamente plano */
            #stage {
                width: 100%;
                height: 100dvh;
                margin: 0 !important;
                padding: 0;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                perspective: none !important;
                transform: none !important;
                transform-style: flat !important;
            }

            #book {
                width: 90vw;
                height: 65dvh;
                margin: 8vh 0 0;
                position: relative;
                background: transparent !important;
                perspective: none !important;
                transform: none !important;
                transform-style: flat !important;
                box-shadow: none !important;
            }

            /* Todas las páginas se mantienen planas y ocultas */
            .page,
            #cover-page {
                display: none !important;
                position: absolute !important;
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                transform: none !important;
                transform-style: flat !important;
                transition: none !important;
                perspective: none !important;
                backface-visibility: visible !important;
                -webkit-backface-visibility: visible !important;
                box-shadow: none !important;
            }

            /* Solo la página actual */
            .page.mobile-active,
            #cover-page.mobile-active {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
                pointer-events: auto !important;
                z-index: 50 !important;
                transform: none !important;
                transform-style: flat !important;
            }

            /* Una sola cara, sin 3D */
            .face {
                position: absolute !important;
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                display: flex !important;
                transform: none !important;
                transform-style: flat !important;
                perspective: none !important;
                backface-visibility: visible !important;
                -webkit-backface-visibility: visible !important;
                border-radius: 6px !important;
                overflow: hidden !important;
                box-shadow: 0 4px 15px rgba(0, 0, 0, .3) !important;
            }

            /* La cara trasera jamás participa en móvil */
            .face.back,
            .cover-back {
                display: none !important;
                visibility: hidden !important;
            }

            /*
             * IMPORTANTE:
             * Se elimina el patrón repeating-linear-gradient que podía
             * convertirse en rayas/artefactos en algunas GPUs móviles.
             */
            .face::before,
            .face::after {
                display: none !important;
                content: none !important;
                background: none !important;
            }

            .cover-front {
                position: absolute !important;
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                display: flex !important;
                transform: none !important;
                transform-style: flat !important;
                perspective: none !important;
                backface-visibility: visible !important;
                -webkit-backface-visibility: visible !important;
                box-shadow: 0 4px 15px rgba(0, 0, 0, .5) !important;
                border-radius: 6px !important;
                padding: 30px 20px !important;
                animation: none !important;
            }

            .page-inner {
                width: 100%;
                height: 100%;
                min-height: 0;
                padding: 18px 16px 14px !important;
                overflow: hidden;
            }

            .page-title {
                font-size: 1.15rem;
                line-height: 1.25;
                margin-bottom: 8px;
            }

            .page-text-wrap {
                min-height: 0;
                overflow: hidden;
            }

            .page-text {
                font-size: .88rem;
                line-height: 1.6;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
                scrollbar-width: none;
            }

            .page-text::-webkit-scrollbar {
                display: none;
            }

            /* El degradado inferior también se elimina en móvil */
            .page-text-wrap::after {
                display: none !important;
                content: none !important;
            }

            .scroll-hint {
                font-size: .95rem !important;
                height: 28px !important;
                line-height: 28px !important;
                opacity: 1 !important;
                color: #c2185b !important;
                font-weight: 700 !important;
                letter-spacing: 1.5px !important;
                text-shadow: 0 1px 4px rgba(194, 24, 91, .25) !important;
                animation: mobileScrollHint 1.4s ease-in-out infinite !important;
            }

            @keyframes mobileScrollHint {

                0%,
                100% {
                    transform: translateY(0);
                    opacity: .65;
                }

                50% {
                    transform: translateY(4px);
                    opacity: 1;
                }
            }

            .page-ornament {
                font-size: .9rem;
                margin-top: 8px;
            }

            .cover-title {
                font-size: 1.8rem;
                line-height: 1.2;
                text-shadow: none !important;
            }

            .cover-sub {
                font-size: .85rem;
                margin-top: 8px;
            }

            .cover-ornament {
                font-size: 1.3rem;
                margin-bottom: 10px;
                animation: none !important;
            }

            .cover-divider {
                width: 75%;
                margin: 12px auto;
            }

            .cover-heart {
                font-size: 1.6rem;
                animation: none !important;
            }

            .cover-hint {
                font-size: .68rem;
                bottom: 15px;
            }

            /* Botones: sin blur/backdrop-filter */
            .nav-btn {
                width: 44px;
                height: 44px;
                font-size: 1.5rem;
                border-radius: 50%;
                background: rgba(194, 24, 91, .85) !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                bottom: 30px;
                top: auto;
                transform: none !important;
                transition: none !important;
                border: 2px solid rgba(255, 255, 255, .2) !important;
                box-shadow: none !important;
            }

            .nav-btn:hover {
                transform: none !important;
            }

            #btn-prev {
                left: 15vw;
            }

            #btn-next {
                right: 15vw;
            }

            #page-indicator {
                bottom: 42px;
                font-size: .9rem;
            }
        }
    </style>
</head>

<body>

    <div class="petals-bg" id="petals"></div>

    <!-- Title -->
    <div class="title-bar">
        <h1>🍓 Mi Chica Fresa</h1>
        <p>Te amo hasta el infinito y más allá, a pasitos de tortuga en tacones de hielo caminando sobre fuego 🐢❤️🔥
        </p>
    </div>

    <!-- Navigation -->
    <button class="nav-btn" id="btn-prev" onclick="flipPrev()" disabled>&#8249;</button>
    <button class="nav-btn" id="btn-next" onclick="flipNext()">&#8250;</button>

    <!-- Book -->
    <div id="stage">
        <div id="book">
            <!-- Cover -->
            <div id="cover-page" onclick="flipNext()">
                <div class="cover-front">
                    <div class="cover-ornament">✦ ❦ ✦</div>
                    <div class="cover-divider"></div>
                    <div class="cover-title">Mi Chica Fresa</div>
                    <div class="cover-sub">Para ti, con todo mi amor</div>
                    <div class="cover-heart">❤️</div>
                    <div class="cover-divider"></div>
                    <div class="cover-hint">Toca para abrir ›</div>
                </div>
                <div class="cover-back"></div>
            </div>
            <!-- Pages injected by JS -->
        </div>
    </div>


    <!-- Footer -->
    <div id="footer-text">Tú y yo, yo y tú, rodeando la montaña ❤ ❤ ❤</div>

    <script>
        // ─────────────────────────────────────────────
        //  TEXTS — agrega aquí los textos de amor
        //  Cada objeto es UNA página. Si el texto es largo
        //  se recortará automáticamente; agrega más páginas.
        // ─────────────────────────────────────────────
        const PAGES = [
            {
                title: "Lo que siento por ti",
                text: `Me encuentro aquí escribiéndote estas palabras llenas de amor y sinceridad, porque necesito que sepas lo profundo que es mi sentimiento hacia ti.

No puedo evitar pensar en todo lo que compartimos, en todas las risas, en cada abrazo y en cada mirada que nos hemos dado. Eres el amor de mi vida, mi razón de ser.

Desde el momento en que te vi supe que eras alguien especial. Tus ojos reflejaban ternura y amabilidad, y tu sonrisa iluminaba mi mundo por completo. No puedo imaginar mi vida sin ti, porque sería como vivir en un constante vacío, sin alegría ni ilusión.

Eres quien me ha enseñado a amar de verdad, quien me ha mostrado que el amor puede ser puro y verdadero. Cada día contigo es un regalo y agradezco a la vida por haberte puesto en mi camino.

Tu compañía me llena de felicidad y calma en los momentos más difíciles.`
            },
            {
                title: "Mi promesa para siempre",
                text: `No quiero perderte, mi amor. Eres el centro de mi universo, mi confidente y mi cómplice. Eres mi refugio en los días nublados y mi motor en los días soleados. Quiero compartir a tu lado cada instante de nuestras vidas y construir juntos un futuro lleno de amor.

Prometo cuidar de nuestro amor y de nuestra relación, porque eres lo más valioso que tengo en mi vida. No importan las adversidades que encontremos en el camino, juntos podemos superar cualquier obstáculo. Me comprometo a ser tu compañero fiel, a apoyarte en tus sueños y a celebrar tus logros como si fueran los míos.

No quiero perderte, porque eres mi hogar, mi paz y mi felicidad. Sin importar las dificultades que se presenten, siempre estaré aquí, poniendo todo de mi parte para que nuestro amor florezca y perdure en el tiempo.

Te amo más de lo que las palabras pueden expresar y deseo que nunca olvides cuánto te valoro y te admiro. Estoy dispuesto a luchar por nuestro amor, a aprender de nuestros errores y a crecer como personas a tu lado.

Gracias por ser el amor de mi vida, por enseñarme el verdadero significado del amor y por ser el mayor regalo que he recibido. No quiero perderte — nunca podré amar a nadie como te amo a ti. ❤️`
            },

        /* Build pages */
        const book = document.getElementById('book');

        /* Check if a page text overflows and toggle the scroll hint */
        function checkScroll(i) {
            const pt = document.getElementById(`pt-${i}`);
            const wrap = document.getElementById(`wrap-${i}`);
            if (!pt || !wrap) return;
            const atBottom = pt.scrollTop + pt.clientHeight >= pt.scrollHeight - 4;
            wrap.classList.toggle('has-more', !atBottom);
        }

        /* Run on load so pages that overflow show the hint immediately */
        function initScrollHints() {
            PAGES.forEach((_, i) => {
                const pt = document.getElementById(`pt-${i}`);
                if (pt && pt.scrollHeight > pt.clientHeight) {
                    document.getElementById(`wrap-${i}`).classList.add('has-more');
                }
            });
        }
        setTimeout(initScrollHints, 150);

        // On mobile, show the "desliza" hint whenever a page has more text.
        function updateMobileScrollHints() {
            if (!window.matchMedia('(max-width: 640px)').matches) return;
            PAGES.forEach((_, i) => {
                const pt = document.getElementById(`pt-${i}`);
                const wrap = document.getElementById(`wrap-${i}`);
                if (!pt || !wrap) return;
                wrap.classList.toggle('has-more', pt.scrollHeight > pt.clientHeight + 4);
            });
        }

        window.addEventListener('resize', updateMobileScrollHints);


        let currentPage = 0; // 0 = cover visible

        const isMobile = () => window.matchMedia('(max-width: 640px)').matches;

        function updateUI() {
            const total = pageEls.length - 1;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage >= total;

            // Mobile: show exactly one page and do NOT depend on CSS 3D transitions.
            if (isMobile()) {
                pageEls.forEach((el, idx) => {
                    el.classList.toggle('mobile-active', idx === currentPage);
                    el.style.zIndex = idx === currentPage ? '50' : '0';
                    el.style.display = idx === currentPage ? 'block' : 'none';
                    el.style.transform = 'none';
                });
                return;
            }

            // Desktop: original stacked-book behavior.
            pageEls.forEach((el, idx) => {
                if (idx === currentPage) {
                    el.classList.add('mobile-active');
                } else {
                    el.classList.remove('mobile-active');
                }
            });
        }

        function setZIndexes() {
            // Pages not yet flipped sit stacked from bottom (low z) to front (high z).
            // Pages already flipped go behind everything.
            pageEls.forEach((el, idx) => {
                if (idx < currentPage) {

        let isAnimating = false;

        function flipNext() {
            if (currentPage >= pageEls.length - 1 || isAnimating) return;

                return;

            isAnimating = true;
            const el = pageEls[currentPage];
            el.style.zIndex = 9999;
            el.classList.add('flipped');
            currentPage++;
            updateUI();
            el.addEventListener('transitionend', function handler() {
                el.removeEventListener('transitionend', handler);
                setZIndexes();
                isAnimating = false;

                currentPage--;
                updateUI();

                const pt = document.getElementById(`pt-${currentPage - 1}`);
                if (pt) pt.scrollTop = 0;
                setTimeout(updateMobileScrollHints, 50);
                return;
            }

            isAnimating = true;
            currentPage--;
            const el = pageEls[currentPage];
            el.style.zIndex = 9999;
            el.classList.remove('flipped');
            updateUI();
            el.addEventListener('transitionend', function handler() {
                el.removeEventListener('transitionend', handler);
                setZIndexes();
                isAnimating = false;
            });
        }


        /* Keyboard navigation */
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') flipNext();
            if (e.key === 'ArrowLeft') flipPrev();
        });

        // Initialize: cover on top, buttons correct
        setZIndexes();
        updateUI();
        setTimeout(updateMobileScrollHints, 250);

        // Keep the correct rendering mode after rotating/resizing the phone.
        window.addEventListener('resize', () => {
            setZIndexes();
            updateUI();
        });
    </script>
</body>

</html>
